apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mvc-service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.deployments.mvc.containerServiceType }}
  selector:
    app: {{ .Release.Name }}-mvc-selector
  ports:
    - port: {{ .Values.deployments.mvc.containerPort }}
      targetPort: {{ .Values.deployments.mvc.containerPort }}
      protocol: TCP
      name: {{ .Values.deployments.mvc.containerPortName }}