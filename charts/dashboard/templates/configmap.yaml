apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-configmap
  namespace: {{ .Release.Namespace }}
data:
  TZ: {{ .Values.infrastructure.dotnet.TZ }}
  RUNNING_IN_CONTAINER: {{ .Values.infrastructure.images.RUNNING_IN_CONTAINER | quote }}
  NON_ROOT_USER: {{ .Values.infrastructure.images.NON_ROOT_USER }}
  SUDO_ASKPASS: {{ .Values.infrastructure.images.SUDO_ASKPASS }}