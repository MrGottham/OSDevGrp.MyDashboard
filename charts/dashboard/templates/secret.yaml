apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
data:
  authenticationRedditClientId: {{ required "settings.authentication.reddit.clientId must be set" .Values.settings.authentication.reddit.clientId | toString | b64enc | quote }}
  authenticationRedditClientSecret: {{ required "settings.authentication.reddit.clientSecret must be set" .Values.settings.authentication.reddit.clientSecret | toString | b64enc | quote }}